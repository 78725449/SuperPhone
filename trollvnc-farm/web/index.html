<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>SuperPhone 群控台</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <h1>SuperPhone 群控台</h1>
  <div id="meta" class="meta"></div>
  <div class="actions">
    <label class="zoom" title="拖动调整设备卡片宽度（像素）：最小值=每行15列，最大值=每行5列，卡片从左到右逐行自适应平铺填满">
      卡片
      <input type="range" id="cardwRange" min="160" max="400" step="5" value="280" />
      <span id="cardwVal">280px</span>
    </label>
    <!-- 布局切换：卡片（宫格）/ 列表 两档（借鉴 IPA 控制端布局按钮；PC 端隐藏，移动端主用） -->
    <div class="layout-switch">
      <button id="layoutBtn" class="layout-btn" title="布局切换（卡片/列表）">
        <svg id="layoutIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
      </button>
      <div id="layoutMenu" class="layout-menu hidden">
        <div class="lopt sel" data-l="grid">卡片<span class="chk">✓</span></div>
        <div class="lopt" data-l="list">列表<span class="chk">✓</span></div>
      </div>
    </div>
    <button id="btnRefresh" title="刷新设备状态">刷新</button>
    <button id="directBtn" class="direct-bar" title="直控模式：所有设备开启推流，卡片上直接点击控制">直控</button>
    <button id="batchBtn" class="batch-bar" title="批量操作：点击进入多选模式（卡片出现复选框），勾选后再次点击弹出批量菜单">批量操作</button>
    <button id="btnAdd" class="primary" title="手动添加设备">+ 添加设备</button>
  </div>
</header>

<main>
  <div id="workspace">
    <!-- 左：放大后的设备画面（点击卡片后出现，此区域才可操作） -->
    <section id="focusPanel" class="focus-panel hidden">
      <div class="focus-head">
        <span id="focusStatusDot" class="focus-status off" title="连接状态（蓝=已连接 / 红=已断开）"></span>
        <span id="focusTitle"></span>
      </div>
      <div id="focusScreen" class="screen">
        <div id="focusStage" class="focus-stage"></div>
        <!-- 聚焦画面中央状态浮层（与 5801 直连页一致）：连接中加载动画 / 断开重连提示 -->
        <div id="focusStatusOv" class="focus-status-ov hidden">
          <div class="spin"></div>
          <div id="focusStatusText">连接中…</div>
        </div>
      </div>
    </section>

    <!-- 中：操作列，紧贴设备屏幕右侧 -->
    <aside id="focusOps" class="focus-ops hidden">
      <div id="focusOpsCap" class="focus-ops-cap"></div>
      <hr />
      <button id="btnSync" class="op sync-btn" title="同步控制：点击选择设备与主控同步"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3.5" width="9.5" height="17" rx="2"/><rect x="14" y="7" width="8" height="13" rx="1.8"/><path d="M12.1 10.3l1.8 1.4-1.8 1.4" fill="currentColor" stroke="none"/><path d="M13.9 10.3l-1.8 1.4 1.8 1.4" fill="currentColor" stroke="none"/></svg></button>
      <button data-op="full" class="op" title="全屏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg></button>
      <button data-op="disc" class="op danger" title="断开"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/><path d="M9.5 14.5l5-5"/></svg></button>
    </aside>

    <!-- 右：其它设备的屏幕墙 -->
    <div id="wall" class="wall-grid"></div>
  </div>

  <div id="empty" class="empty hidden">
    没有在线设备。内网 iOS 设备开启 SuperPhone 并配置网关后会自动出现。
  </div>

  <!-- 移动端：圆形白色 WiFi 信号悬浮按钮（可拖动调整位置，点击展开操作菜单；WiFi 按设备延迟显示强度颜色） -->
  <div id="fab" class="fab hidden" title="设备延迟状态（拖动调整位置，点击展开操作）">
    <svg class="wifi" id="fabSig" viewBox="0 0 24 24" aria-hidden="true">
      <path class="arc a1" d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="currentColor"/>
      <path class="arc a2" d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="currentColor"/>
      <path class="arc a3" d="M9 17l3 3 3-3c-1.65-1.66-4.34-1.66-6 0z" fill="currentColor"/>
    </svg>
  </div>

  <!-- 移动端操作菜单（悬浮按钮点击展开，含退出控制） -->
  <div id="opsMenu" class="ops-menu hidden">
    <div id="opsMenuCap" class="ops-menu-grid"></div>
    <div class="ops-menu-grid" style="margin-top:6px">
      <button data-op="full" title="全屏"><span class="cap-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg></span><span class="cap-name">全屏</span></button>
      <button data-op="disc" class="danger" title="断开（退出控制并返回设备墙）"><span class="cap-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/><path d="M9.5 14.5l5-5"/></svg></span><span class="cap-name">断开</span></button>
    </div>
  </div>
</main>

<!-- 控制端软键盘输入源：触屏端「键盘」能力键聚焦此隐藏 input 唤起 iOS 软键盘，
     app.js 中 Keyboard 实例绑定它抓取 keydown/keyup 直发当前聚焦设备（noVNC 官方 touch 键盘方案） -->
<input id="kbdInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
       tabindex="-1" aria-label="键盘输入（控制被控设备）"
       style="position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0;border:0;pointer-events:none;" />

<!-- 添加/编辑设备 -->
<div id="addModal" class="modal hidden">
  <div class="modal-card">
    <h3 id="addTitle">添加设备</h3>
    <label>名称 <input id="fName" placeholder="如：iPhone 15" /></label>
    <label>IP / 主机 <input id="fHost" placeholder="192.168.1.23" /></label>
    <label>端口 <input id="fPort" type="number" value="5901" /></label>
    <label>分组（可选） <input id="fGroup" placeholder="如：demo" /></label>
    <label>备注 <input id="fNote" placeholder="可选" /></label>
    <div class="modal-btns">
      <button id="btnSaveDevice" class="primary">保存</button>
      <button id="btnCancelAdd">取消</button>
    </div>
  </div>
</div>

<!-- 设置排序号（2026-08-15：决定卡片墙从左到右、从上到下排列位置；排序号不显示） -->
<div id="orderModal" class="modal hidden">
  <div class="modal-card">
    <h3 id="orderTitle">设置排序号</h3>
    <label>排序号（0-99999，越小越靠前） <input id="fOrder" type="number" min="0" max="99999" placeholder="留空 = 清除，按注册时间排序" /></label>
    <div class="modal-btns">
      <button id="btnSaveOrder" class="primary">保存</button>
      <button id="btnCancelOrder">取消</button>
    </div>
  </div>
</div>

<!-- 设备卡片小菜单 -->
<div id="tileMenu" class="tile-menu hidden"></div>

<script type="module" src="app.js?v=96"></script>
</body>
</html>
